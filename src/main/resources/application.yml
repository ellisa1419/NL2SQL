server:
  port: 8080

spring:
  application:
    name: nl2sql-engine
  datasource:
    url: jdbc:sqlite:data/analytics.db
    driver-class-name: org.sqlite.JDBC

engine:
  sla-ms: 1500

logging:
  level:
    root: WARN
    com.acme.nl2sql: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n"
